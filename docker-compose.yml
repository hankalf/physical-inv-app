# On-site deployment: docker compose up -d on any PC in the warehouse.
services:
  inventory:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-changeme}"
      DB_PATH: /data/inventory.db
    volumes:
      - inventory-data:/data
volumes:
  inventory-data:
