# Runs every test suite on each push and pull request, the same way
# `npm test` runs them locally: a fresh server per suite, a real Chromium
# driving the pages and the scanner app. A red cross on a commit means a
# suite failed - open the run, and the failing check is named in the log.
name: Tests

on:
  push:
    branches: ['main', 'version-*', 'claude/**']
  pull_request:
  workflow_dispatch:        # the "Run workflow" button on the Actions tab

# a newer push to the same branch replaces a run still going
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium for the browser tests
        run: |
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM=$(node -e "import('playwright-core').then(p => console.log(p.chromium.executablePath()))")" >> "$GITHUB_ENV"

      - name: Run every suite
        run: npm test
        env:
          TZ: America/New_York

      - name: Keep the screenshots when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
          retention-days: 7
